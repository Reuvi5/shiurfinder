# OPTIONAL local database. You only need this to change the schema;
# day to day everyone uses the shared AWS database instead.
# See README, "Changing the database".
#
# Same setup as AWS (Postgres 16 + PostGIS + pg_trgm), so the same
# migrations and SQL work on both.
#
#   npm run db:up      start it
#   npm run db:down    stop it (your data is kept)
#
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: shiurfinder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiurfinder
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: shiurfinder
    ports:
      - "5432:5432"
    volumes:
      - shiurfinder-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiurfinder -d shiurfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shiurfinder-pgdata:
