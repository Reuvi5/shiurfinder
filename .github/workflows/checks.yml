# Runs on every PR: GitHub checks the code before anyone merges it.
# A red X on the PR means one of these failed; click it to see which.

name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Formatting (fix with npm run format)
        run: npm run format:check
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests (run them with npm test)
        run: npm test -- --coverage

  # The SQL tests, on a fresh database that exists only for this run. This is
  # also how they run for anyone without Docker.
  sql-tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: shiurfinder
          POSTGRES_PASSWORD: localdevpassword
          POSTGRES_DB: shiurfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiurfinder -d shiurfinder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://shiurfinder:localdevpassword@localhost:5432/shiurfinder_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: SQL tests (run them with npm run test:db)
        run: npm run test:db
